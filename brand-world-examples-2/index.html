<script>
  var SCREENS = ["GLAM HUSTLE HUB\n\nWorked Examples Library\nBrand World Generator\n\nUse these when you need a live example fast.\nEach niche is fully worked through: customer, problem, solution, uses, consistency anchors, 15-scene Brand World, one\nfinished image prompt, generator presets, positioning, and monetization examples.", "1. Pet Boutique\n\n2. Bakery\n\n3. Beauty Salon\n\n4. Nail Salon\n\n5. Farm / Homestead\n\nPet Boutique\nFully worked example\n\nPet Boutique - Strategy Snapshot\n\nPERSON\n\nA first-time boutique owner selling stylish pet accessories to millennial and Gen Z pet parents.", "PROBLEM\n\nShe needs a polished stream of branded visuals for products, social media, website banners,\nseasonal launches, and ads - but cannot afford constant professional photo shoots.\n\nPRODUCT\n\nA Pet Boutique Brand World Generator that creates cohesive commercial image prompts for every\npart of the store and customer journey.", "PRESENTATION\n\nWebsite hero images \u2022 Instagram/Pinterest content \u2022 product-launch ads\n\nPlayful upscale boutique; blush, cream, warm oak, matte black; soft daylight; clean editorial\nCONSISTENCY ANCHORS\npet-lifestyle photography.\n\nPet Boutique\n15-scene Brand World\n\n15 scenes that belong to the same world\n\nStorefront with branded awning and dog-friendly window display\n\nWelcome/reception area with treat jar and leash wall\n\nCollar + harness display wall\n\nPet apparel rack with seasonal outfits\n\nTreat bakery counter with glass jars\n\nGrooming accessory display\n\nPet bed + home decor corner\n\nCheckout counter with branded bags\n\nGift-wrapping and packing station\n\nOwner helping a customer fit a harness\n\nDog trying on a bandana in front of mirror\n\nClose-up flat lay of collar, leash, tag and treats\n\nHoliday window display\n\nOutdoor \u201cYappy Hour\u201d customer event\n\nWebsite hero scene with owner + happy dog", "Pet Boutique\nFinished image prompt + generator presets\n\nFinished Image Prompt\nCreate a polished upscale pet boutique interior for a modern pet-accessories brand. Use blush pink, warm cream,\nnatural oak, and matte black accents. Show a curated collar-and-leash wall, neatly folded pet apparel, woven\nbaskets, a small treat counter with glass jars, branded shopping bags, and tasteful paw-inspired decor without\nbecoming cartoonish. Include one stylish shop owner assisting a customer with a small dog near a full-length mirror.\nSoft natural daylight, warm welcoming mood, clean editorial commercial photography, eye-level wide-angle\ncomposition, realistic materials and proportions. Designed as a website hero image with open negative space for\nheadline text. Avoid random text, misspelled signs, clutter, duplicated animals, distorted anatomy, extra limbs, or\ncolors outside the palette.", "Generator Input Example\n\nBusiness Type: Pet boutique\nTarget Customer: Style-conscious pet parents\nProducts: Collars, leashes, apparel, treats, beds, gifts\nBrand Style: Playful upscale\nColors: Blush, cream, oak, matte black\nMaterials: Natural wood, linen, glass, matte metal\nScene: Collar + harness wall\nSeason: Everyday / spring\nTime: Late morning\nPeople: Owner + customer + dog\nMood: Welcoming, stylish, joyful\nLighting: Soft daylight\nCamera: Eye-level wide angle\nPurpose: Website hero", "Pet Boutique\nPositioning + monetization example\n\nPositioning Statement\n\nThe Pet Boutique Brand World Generator helps boutique pet retailers create cohesive lifestyle and product visuals\nwithout planning a new photo shoot for every campaign.\n\nProduct Ladder Example\n\nFree: 10 Pet Boutique Scene Prompts\n\n$2: 25 Pet Shop Social Scene Prompts", "$7-$17: Pet Boutique Visual Prompt Pack\n\nMain: Pet Boutique Brand World Generator\n\nPremium: Generator + seasonal preset library + custom brand profile setup\n\nBundle: Generator + 100 prompts + product-photo guide + holiday pack\n\nTEACHER USE\n\nUse this example only when the room gets stuck. Let students think first, then show the example to demonstrate\nwhat \u201cspecific, cohesive, and monetizable\u201d looks like.", "Bakery\n\nFully worked example\n\nBakery - Strategy Snapshot\n\nPERSON\n\nA home baker moving into a storefront and trying to make the brand look established online before\nevery space is professionally photographed.\n\nPROBLEM\n\nShe needs appetizing, consistent visuals for cakes, packaging, storefront, seasonal launches,\ncatering, and social content.", "PRODUCT\n\nA Bakery Brand World Generator for branded food, shop, kitchen, packaging, and\ncustomer-experience scenes.\n\nPRESENTATION\n\nMenu/website \u2022 seasonal launch graphics \u2022 Pinterest/social posts\n\nWarm modern bakery; buttercream, dusty rose, espresso brown, brass; marble + oak; soft\nCONSISTENCY ANCHORS\nmorning light; elevated but cozy.", "Bakery\n15-scene Brand World\n\n15 scenes that belong to the same world\n\nStreet-facing storefront with pastry window\n\nFront counter with cake case\n\nPastry display close-up\n\nCake consultation table\n\nOpen baking kitchen\n\nDecorator piping a celebration cake\n\nPackaging station with boxes and ribbon\n\nCoffee + pastry corner\n\nPickup shelf for pre-orders\n\nWedding cake display alcove\n\nBirthday cake hero product shot\n\nFlat lay of cookies and branded packaging\n\nHoliday cookie launch display\n\nOwner greeting a repeat customer\n\nWebsite hero with cakes, flowers, and open counter", "Bakery\nFinished image prompt + generator presets\n\nFinished Image Prompt\nCreate an elevated modern bakery interior with a warm buttercream, dusty rose, espresso brown, and brushed brass\npalette. Feature a marble pastry counter, oak shelving, an elegant glass cake case filled with realistic pastries,\nbranded cake boxes tied with soft ribbon, fresh flowers, and a glimpse into an open baking kitchen. Include a baker\ndecorating a celebration cake behind the counter. Soft morning window light, cozy premium mood, editorial food and\ninterior photography, wide-angle eye-level composition, realistic textures and appetizing food styling. Suitable for a\nbakery website hero. Leave clean negative space for headline text. Avoid gibberish signage, messy counters,\ndeformed hands, impossible food shapes, excessive pink, or random props.", "Generator Input Example\n\nBusiness Type: Bakery\nTarget Customer: Celebration + wedding customers\nProducts: Cakes, cupcakes, cookies, coffee, catering\nBrand Style: Warm modern\nColors: Buttercream, dusty rose, espresso, brass\nMaterials: Marble, oak, glass, brushed brass\nScene: Front pastry counter\nSeason: Everyday\nTime: Morning\nPeople: Baker + customer\nMood: Cozy, premium, inviting\nLighting: Natural morning light\nCamera: Wide angle\nPurpose: Website / social", "Bakery\nPositioning + monetization example\n\nPositioning Statement\n\nThe Bakery Brand World Generator helps bakers create a consistent visual brand across storefront, kitchen, product,\nand seasonal scenes without needing a full photo shoot for every launch.\n\nProduct Ladder Example\n\nFree: 10 Bakery Scene Prompts", "$2: Mini Holiday Bakery Prompt Pack\n\n$7-$17: 50 Bakery Marketing Prompts\n\nMain: Bakery Brand World Generator\n\nPremium: Generator + wedding/holiday/catering presets\n\nBundle: Generator + prompts + food-photo styling guide + seasonal pack\n\nTEACHER USE\n\nUse this example only when the room gets stuck. Let students think first, then show the example to demonstrate\nwhat \u201cspecific, cohesive, and monetizable\u201d looks like.", "Beauty Salon\nFully worked example\n\nBeauty Salon - Strategy Snapshot\n\nPERSON\n\nAn independent salon owner upgrading from booth rental to a luxury multi-service studio.\n\nPROBLEM\n\nShe wants the business to look premium and consistent across service pages, booking promos,\nteam recruitment, retail, and social media.", "PRODUCT\n\nA Beauty Salon Brand World Generator that creates scenes for services, retail, team, client\nexperience, and marketing.\n\nPRESENTATION\n\nBooking site \u2022 service promotions \u2022 recruitment / social\n\nModern feminine luxury; ivory, mocha, champagne gold, soft black; stone, boucle, glass; diffused\nCONSISTENCY ANCHORS\ndaylight.", "Beauty Salon\n15-scene Brand World\n\n15 scenes that belong to the same world\n\nExterior salon signage\n\nReception desk\n\nWaiting lounge\n\nStyling station row\n\nHair-wash suite\n\nColor mixing bar\n\nPrivate consultation area\n\nRetail product wall\n\nNail/beauty add-on corner\n\nBack-bar product detail shot\n\nStylist consulting a client\n\nBlowout in progress\n\nTeam lifestyle portrait in salon\n\nBridal prep scene\n\nBooking-site hero image", "Beauty Salon\nFinished image prompt + generator presets\n\nFinished Image Prompt\nCreate a modern feminine luxury beauty salon with ivory walls, warm mocha upholstery, champagne-gold fixtures,\nsoft-black accents, and natural stone surfaces. Show an elegant reception desk, curved boucle seating, tall mirrors\nwith refined lighting, a curated professional hair-product wall, and a stylist consulting a client at one station. Keep the\nsalon uncluttered, high-end, warm, and realistic. Diffused daylight with soft flattering interior illumination, polished\neditorial beauty photography, eye-level wide-angle composition, designed for a salon booking website. Avoid random\ntext, excessive gold, distorted mirrors, duplicate furniture, deformed hands, or sterile medical styling.", "Generator Input Example\n\nBusiness Type: Beauty salon\nTarget Customer: Professional women seeking premium services\nServices: Hair, color, blowouts, bridal, retail\nStyle: Modern feminine luxury\nColors: Ivory, mocha, champagne gold, soft black\nMaterials: Stone, boucle, glass, brushed metal\nScene: Styling stations\nTime: Afternoon\nPeople: Stylist + client\nMood: Calm, elevated, welcoming\nLighting: Diffused daylight\nCamera: Eye-level wide angle\nPurpose: Booking website", "Beauty Salon\nPositioning + monetization example\n\nPositioning Statement\n\nThe Beauty Salon Brand World Generator helps salon owners create premium, cohesive service and lifestyle visuals\nwithout relying on generic stock photos.\n\nProduct Ladder Example\n\nFree: 10 Luxury Salon Scene Prompts\n\n$2: Salon Social Promo Prompt Mini Pack\n\n$7-$17: 50 Salon Visual Prompts", "Main: Beauty Salon Brand World Generator\n\nPremium: Generator + service presets + brand setup\n\nBundle: Generator + prompts + seasonal campaigns + booking-image guide\n\nTEACHER USE\n\nUse this example only when the room gets stuck. Let students think first, then show the example to demonstrate\nwhat \u201cspecific, cohesive, and monetizable\u201d looks like.", "Nail Salon\n\nFully worked example\n\nNail Salon - Strategy Snapshot\n\nPERSON\n\nA nail tech opening her first boutique nail studio and trying to differentiate from generic\npink-and-marble salon branding.\n\nPROBLEM\n\nShe needs distinctive branded scenes for services, nail art, retail, client experience, memberships,\nand seasonal campaigns.", "PRODUCT\n\nA Nail Studio Brand World Generator with visual presets for manicure, pedicure, nail-art, product,\nclient, and campaign scenes.\n\nPRESENTATION\n\nInstagram/Pinterest \u2022 booking page \u2022 seasonal nail campaigns\n\nEditorial boutique nail studio; terracotta, oat, deep plum, brushed chrome; sculptural furniture;\nCONSISTENCY ANCHORS\nclean but warm.", "Nail Salon\n15-scene Brand World\n\n15 scenes that belong to the same world\n\nExterior window + logo area\n\nCheck-in counter\n\nManicure station\n\nPedicure lounge\n\nNail art consultation bar\n\nPolish display wall\n\nSanitation/prep station\n\nRetail cuticle-care shelf\n\nClient choosing colors\n\nClose-up manicure in progress\n\nFinished nail-art beauty shot\n\nMembership / VIP lounge moment\n\nBridal nail appointment\n\nHoliday color collection display\n\nSocial-media hero with hands + products", "Nail Salon\nFinished image prompt + generator presets\n\nFinished Image Prompt\nCreate an editorial boutique nail studio that feels warm, modern, and distinctive rather than stereotypically pink. Use\nterracotta, soft oat, deep plum, and brushed chrome. Feature sculptural manicure tables, ergonomic chairs, a\nbeautifully organized polish wall, subtle natural textures, and a clean sanitation station in the background. Show a\nnail artist consulting with a client over a curated color palette. Soft directional daylight, sophisticated creative mood,\nrealistic skin and hands, premium beauty editorial photography, eye-level medium-wide composition for a booking\npage. Avoid extra fingers, distorted hands, neon clutter, random signage, generic marble-everywhere styling, or\ncolors outside the palette.", "Generator Input Example\n\nBusiness Type: Nail studio\nTarget Customer: Style-conscious clients\nServices: Manicures, pedicures, nail art, bridal, memberships\nStyle: Editorial boutique\nColors: Terracotta, oat, deep plum, chrome\nMaterials: Plaster, wood, chrome, linen\nScene: Nail art consultation bar\nPeople: Nail artist + client\nMood: Creative, elevated, relaxed\nLighting: Soft directional daylight\nCamera: Medium-wide\nPurpose: Booking + social", "Nail Salon\nPositioning + monetization example\n\nPositioning Statement\n\nThe Nail Studio Brand World Generator helps nail professionals create distinctive branded visuals for services and\ncampaigns without falling back on the same generic salon look.\n\nProduct Ladder Example\n\nFree: 10 Nail Studio Scene Prompts", "$2: Seasonal Nail Campaign Prompt Pack\n\n$7-$17: Nail Content Visual Pack\n\nMain: Nail Studio Brand World Generator\n\nPremium: Generator + seasonal palette presets + brand setup\n\nBundle: Generator + 100 scenes + content planner + campaign pack\n\nTEACHER USE\n\nUse this example only when the room gets stuck. Let students think first, then show the example to demonstrate\nwhat \u201cspecific, cohesive, and monetizable\u201d looks like.", "Farm / Homestead\nFully worked example\n\nFarm / Homestead - Strategy Snapshot\n\nPERSON\n\nA family-run farm expanding into farm-to-table products, workshops, events, and an on-site shop.\n\nPROBLEM\n\nThey need a consistent visual story across the farm, products, events, website, and seasonal\nmarketing - not just pretty farmhouse pictures.", "PRODUCT\n\nA Farm/Homestead Brand World Generator that maps the entire customer and product\nexperience.\n\nPRESENTATION\n\nWebsite storytelling \u2022 Pinterest \u2022 event/product marketing\n\nRefined rustic homestead; cream, sage, weathered oak, charcoal; linen, galvanized metal, stone;\nCONSISTENCY ANCHORS\ngolden natural light.\n\nFarm / Homestead\n15-scene Brand World\n\n15 scenes that belong to the same world\n\nFarm entrance and branded sign\n\nMain farmhouse exterior", "Working barn\n\nVegetable garden rows\n\nGreenhouse\n\nProduce stand\n\nFarm shop interior\n\nJam/candle/honey product display\n\nPackaging and labeling table\n\nFarm-to-table kitchen\n\nChicken coop / animal care scene\n\nFamily harvesting produce\n\nCustomer workshop or farm tour\n\nAutumn harvest market setup\n\nGolden-hour website hero across the property", "Farm / Homestead\nFinished image prompt + generator presets\n\nFinished Image Prompt\nCreate a refined rustic family farm brand scene featuring a welcoming farm shop beside a working homestead. Use\nwarm cream, muted sage green, weathered oak, charcoal accents, galvanized metal, linen, and natural stone. Show\nbaskets of fresh produce, shelves with jars of preserves and honey, simple branded kraft packaging, wildflowers, and\na glimpse of the garden through open doors. Include the owner arranging produce while two customers browse.\nWarm golden natural light, authentic polished rural mood, realistic editorial lifestyle photography, eye-level\nwide-angle composition, designed for a farm-to-table website hero. Avoid overly staged farmhouse decor, random\ntext, impossible produce, clutter, or exaggerated rustic props.", "Generator Input Example\n\nBusiness Type: Farm / homestead\nTarget Customer: Local families + farm-to-table shoppers\nProducts: Produce, preserves, honey, candles, workshops\nStyle: Refined rustic\nColors: Cream, sage, oak, charcoal\nMaterials: Wood, linen, galvanized metal, stone\nScene: Farm shop\nSeason: Early fall\nTime: Golden hour\nPeople: Owner + customers\nMood: Authentic, warm, grounded\nLighting: Golden natural light\nCamera: Wide angle\nPurpose: Website hero", "Farm / Homestead\nPositioning + monetization example\n\nPositioning Statement\n\nThe Farm Brand World Generator helps farm and homestead businesses create a complete, consistent visual story\nacross products, property, events, and marketing without reducing the brand to one farmhouse image.\n\nProduct Ladder Example", "Free: 10 Farm Brand Scene Prompts\n\n$2: Harvest Season Prompt Mini Pack\n\n$7-$17: Farm-to-Table Visual Prompt Pack\n\nMain: Farm/Homestead Brand World Generator\n\nPremium: Generator + seasonal/event/product presets\n\nBundle: Generator + 100 scenes + seasonal packs + product-photo guide\n\nTEACHER USE\n\nUse this example only when the room gets stuck. Let students think first, then show the example to demonstrate\nwhat \u201cspecific, cohesive, and monetizable\u201d looks like."];
  var i = 0;
  var scr = document.getElementById("screen"), cnt = document.getElementById("count"),
      bar = document.getElementById("bar"), back = document.getElementById("backbtn"),
      next = document.getElementById("nextbtn"), copyb = document.getElementById("copybtn");
  function render(){
    scr.textContent = SCREENS[i];
    cnt.textContent = "Screen " + (i+1) + " of " + SCREENS.length;
    bar.style.width = ((i+1)/SCREENS.length*100) + "%";
    back.disabled = i === 0;
    next.textContent = i === SCREENS.length-1 ? "✓ Done" : "Next →";
    copyb.textContent = "Copy This Screen";
    window.scrollTo(0,0);
  }
  back.onclick = function(){ if(i>0){ i--; render(); } };
  next.onclick = function(){ if(i<SCREENS.length-1){ i++; render(); } };
  copyb.onclick = function(){
    function done(){ copyb.textContent = "Copied ✓"; }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(SCREENS[i]).then(done, function(){ fb(); }); }
    else fb();
    function fb(){ var ta=document.createElement("textarea"); ta.value=SCREENS[i]; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){} document.body.removeChild(ta); }
  };
  render();
</script>
