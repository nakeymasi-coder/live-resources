<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make Money Monday — Curriculum</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Segoe UI', system-ui, -apple-system, sans-serif; background:linear-gradient(160deg,#eaf6ff 0%,#f3fbff 55%,#e2f1fd 100%); color:#103B63; min-height:100vh; padding:18px 14px 30px; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:clamp(22px,5.4vw,30px); font-weight:900; text-align:center; line-height:1.2; background:linear-gradient(90deg,#103B63,#168FEA); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .bar { height:10px; background:#d8edfd; border-radius:99px; margin:16px 0 6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#7cc4ff,#168FEA); border-radius:99px; transition:width .25s; }
  .count { text-align:center; font-size:13px; font-weight:700; color:#2c587f; margin-bottom:12px; }
  .card { background:#fff; border:2px solid #cfe8fb; border-radius:20px; padding:20px 18px; box-shadow:0 10px 26px rgba(22,143,234,.13); min-height:300px; }
  .card pre { white-space:pre-wrap; word-wrap:break-word; font-family:inherit; font-size:16px; line-height:1.55; }
  .nav { display:flex; gap:10px; margin-top:14px; }
  .nav button { flex:1; border:none; cursor:pointer; font-weight:800; font-size:16px; padding:14px; border-radius:999px; }
  .back { background:#fff; color:#103B63; border:2px solid #a9d4f7 !important; }
  .next { background:linear-gradient(90deg,#168FEA,#103B63); color:#fff; box-shadow:0 6px 16px rgba(22,143,234,.35); }
  .copy { width:100%; margin-top:10px; border:2px solid #a9d4f7; background:#eaf6ff; color:#103B63; cursor:pointer; font-weight:800; font-size:15px; padding:12px; border-radius:999px; }
  button:disabled { opacity:.35; cursor:default; box-shadow:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Make Money Monday — Curriculum</h1>
  <div class="bar"><i id="bar"></i></div>
  <p class="count" id="count"></p>
  <div class="card"><pre id="screen"></pre></div>
  <button class="copy" id="copybtn">Copy This Screen</button>
  <div class="nav">
    <button class="back" id="backbtn">← Back</button>
    <button class="next" id="nextbtn">Next →</button>
  </div>
</div>
<script>
  var SCREENS = ["MAKE MONEY MONDAY\nTURN A MINI GENERATOR INTO A $2 TUESDAY BUNDLE APP\n\nSKOOL STUDENT CURRICULUM\nComplete self-paced walkthrough for students who miss the live\n\nTODAY'S FINISH LINE\n\nSix coordinated graphics + a working download app + a $2 listing + a\nfull-generator upsell\n\nSeptember 7, 2026 | Built today for $2 Tuesday on September 8\nPrint-friendly edition", "GLAM Daily Class | Make Money Monday\n\nPage 1\n\nWHAT YOU ARE BUILDING\nYou will use one mini image-prompt generator already available in Skool to create six\ncoordinated graphics. You will place those six graphics inside a small Base44 download app,\nadd an upgrade button to a related full generator, and prepare the finished offer for $2\nTuesday.", "YOUR EXACT FINISH LINE\n\u2022\n\nOne focused bundle with a clear audience and purpose\n\n\u2022\n\nSix coordinated graphics saved as six separate files\n\n\u2022\n\nOne working mobile-friendly download app\n\n\u2022\n\nOne full-generator upsell section and working link\n\n\u2022\n\nOne tested $2 listing\n\n\u2022\n\nOne ready-to-post Tuesday promotion", "WHAT YOU NEED BEFORE STARTING\n\u2022\n\nOne mini image-prompt generator from the Skool classroom\n\n\u2022\n\nChatGPT\n\n\u2022\n\nAn image-generation tool\n\n\u2022\n\nA Base44 account\n\n\u2022\n\nA related full generator or paid offer for the upsell\n\n\u2022\n\nA store page or product-listing platform\n\nIMPORTANT RULE\nDo not create a new generator. Your mini generator is the tool. The six finished graphics are\nthe $2 product. The Base44 app is how the buyer receives and downloads them.", "GLAM Daily Class | Make Money Monday\n\nPage 2\n\nSTEP 1: CREATE YOUR BUNDLE FOLDER\n\nOn your computer, open the folder where you keep your business products.\n\nCreate a new folder using your bundle name. If you have not chosen a name, temporarily call it $2 Tuesday\nBundle.\n\nInside that folder, create a second folder named Final Graphics.\n\nKeep the six approved graphics in Final Graphics. Do not mix drafts and final images.", "STEP 2: CHOOSE THE BUNDLE\nOpen your mini generator, then paste Prompt 1 into ChatGPT. Answer one question at a time. Your bundle\nneeds one audience, one purpose, and only six graphics.\nPrompt 1 - Plan the $2 bundle\nI already have a mini image-prompt generator. I do not want to create another large product. Help me turn\nit into one small, focused $2 Tuesday image bundle.\nAsk me for:\n- the mini generator's topic;\n- the audience;\n- the kind of images it creates;\n- the business use for the images;\n- the full generator I will offer as the upgrade.\nThen give me:\n1. One specific bundle theme.\n2. A simple bundle name.\n3. The exact six graphics to create.\n4. One visual rule that keeps the set coordinated.\n5. One sentence explaining the quick win.\n6. One natural upsell connection to the full generator.\nKeep the bundle small enough to finish today. Do not suggest creating a new generator, workbook, course,\nor large product. Do not give me every step at once. Give me the next step, let me complete it, then\ncontinue.", "Write down these results:\n\u2022\n\nBundle name: ________________________________\n\n\u2022\n\nAudience: ____________________________________\n\n\u2022\n\nQuick win: ___________________________________\n\n\u2022\n\nFull generator or next offer: __________________\n\nGLAM Daily Class | Make Money Monday\n\nPage 3\n\nSTEP 3: CREATE SIX IMAGE PROMPTS\n\nUse the mini generator once to create one strong master image prompt.\n\nRead the result and remove anything that does not fit your bundle.\n\nPaste the clean result into Prompt 2 where it says MASTER IMAGE PROMPT.\n\nAsk ChatGPT for the six coordinated variations.", "Confirm that each variation has a different purpose while the visual style stays connected.\nPrompt 2 - Create six coordinated prompts\nUse the image prompt I created with my mini generator as the master style direction below.\nMASTER IMAGE PROMPT:\n[PASTE THE PROMPT FROM YOUR MINI GENERATOR]\nCreate six coordinated prompt variations for one sellable image bundle.\nKeep these locked across all six:\n- audience and business purpose;\n- overall visual style;\n- color family;\n- polish level;\n- image dimensions;\n- typography rules, if text is used.\nChange only the main scene, subject, message, product, pose, or composition needed to make each graphic\nuseful and distinct.\nReturn six complete prompts numbered 1 through 6. Each prompt must create one image on its own separate\ncanvas. Never request a collage, grid, contact sheet, lineup, or multi-image canvas. Keep all visible\nwords short, correctly spelled, unobstructed, and easy to read. Do not add random objects or fake\ninterface graphics.", "STEP 4: GENERATE THE SIX GRAPHICS\n\nCopy only Prompt 1 from your six-prompt set into your image tool.\n\nGenerate one image on one separate canvas.\n\nCheck the image before saving it. Look at words, hands, faces, products, and edges.\n\nSave the approved image in Final Graphics as 01-[short-name].png.\n\nRepeat for prompts 2 through 6. Never ask for a collage or grid.\n\nYour folder should contain exactly six approved files numbered 01 through 06.", "Recommended file pattern:\n01-cover.png | 02-[use].png | 03-[use].png | 04-[use].png | 05-[use].png | 06-[use].png\n\nGLAM Daily Class | Make Money Monday\n\nPage 4\n\nSTEP 5: CHECK THE BUNDLE\nUpload or show the six finished graphics to ChatGPT and paste Prompt 3. Repair only the images that fail the\ncheck.\nPrompt 3 - Quality-check the graphics\nReview my six finished graphics as a paid $2 bundle. Do not redesign them.\nCheck only:\n1. Do all six belong to the same bundle?\n2. Is every image clear, polished, and usable?\n3. Is any visible wording misspelled, blocked, or hard to read?\n4. Are any people, hands, products, or objects visibly distorted?\n5. Are the image sizes consistent?\n6. Is anything duplicated too closely?\n7. Which images are ready, and which need one specific correction?\nGive me a short pass-or-fix result for each image. Do not suggest unrelated changes.", "Do not continue until:\n\u2022\n\nAll six graphics look like one coordinated set.\n\n\u2022\n\nVisible wording is correct and readable.\n\n\u2022\n\nThere are no obvious distortions.\n\n\u2022\n\nEvery graphic has the same intended size.\n\n\u2022\n\nEvery file opens correctly.\n\nSTEP 6: GATHER YOUR APP INFORMATION\n\u2022", "Bundle name\n\n\u2022\n\nOne-sentence quick win\n\n\u2022\n\nBrand or creator name\n\n\u2022\n\nWebsite link\n\n\u2022\n\nFull generator name\n\n\u2022\n\nExact full generator link\n\n\u2022\n\nSix final image files\n\nTest the generator and website links in your browser before adding them to the app.", "GLAM Daily Class | Make Money Monday\n\nPage 5\n\nSTEP 7: BUILD THE BASE44 DOWNLOAD APP\n\nOpen Base44 and start a new app.\n\nAttach or upload the six approved graphics with your request.\n\nCopy Prompt 4 below.\n\nReplace every bracketed field with your real information.\n\nPaste the completed prompt into Base44 and build the app.", "Do not ask Base44 to generate replacement images. It must use your exact uploads.\nPrompt 4 - Build the download app\nCreate a small, polished Base44 delivery app for a $2 image bundle.\nIMPORTANT: This is a simple static download app. Do not add authentication, customer accounts, a database,\nAI image generation, integrations, forms, subscriptions, analytics, usage tracking, or any feature that\ncan create ongoing charges. Do not redesign or alter the six uploaded graphics.\nI will upload exactly six finished image files with this request.\nAPP CONTENT:\nBundle name: [ADD BUNDLE NAME]\nShort promise: [ADD ONE-SENTENCE QUICK WIN]\nCreator or brand name: [ADD BRAND NAME]\nWebsite: [ADD WEBSITE]\nFull generator name: [ADD GENERATOR NAME]\nFull generator link: [ADD GENERATOR LINK]\nREQUIRED LAYOUT:\n- Bright, clean, mobile-first layout.\n- Simple welcome section with the bundle name and short promise.\n- A short line that says: Your six graphics are ready. Tap any image to preview it, then use the download\nbutton to save it.\n- Display the exact six uploaded graphics in a clean one-column mobile layout and a two- or three-column\ndesktop layout.\n- Put one clearly labeled Download Graphic button under each image.\n- Each button must download the original full-quality image file, not a screenshot or compressed preview.\n- If Base44 can support Download All reliably without a database or paid integration, include it. If not,\nomit it. The six individual download buttons are required.\n- Add a small How to Download section with three steps: tap the graphic, tap Download Graphic, then check\nthe device's Downloads or Photos.\n- Add one simple upsell section after the graphics.\nUPSELL COPY:\nHeadline: Want to create thousands more?\nBody: This bundle gives you six ready-to-use graphics. The full [GENERATOR NAME] lets you create your own\ncombinations, styles, and new images whenever you need them.\nButton: Upgrade to the Full Generator\nLink the button to: [GENERATOR LINK]\nFOOTER:\nCreated by [BRAND NAME] | [WEBSITE]\nDESIGN:\nUse the seller's existing brand colors and clean typography. Keep the graphics as the main focus. Use\nplenty of white space, readable text, controlled spacing, and one clear call to action. Do not add crowns,\ndashboards, fake technology graphics, random icons, excessive sparkles, or clutter.\nFUNCTIONAL TESTS:\n- All six exact images appear.\n- Every preview opens or enlarges correctly.\n- Every individual download button saves the correct original image.", "GLAM Daily Class | Make Money Monday\n\nPage 6\n\n- The generator upgrade button opens the exact provided link.\n- The website link works.\n- The app works on phone and desktop.\nBuild only this app. Do not add extra pages or features.", "STEP 8: TEST THE APP\n\nOpen the app preview on your computer.\n\nOpen the app on your phone if a preview link is available.\n\nTap every graphic preview.\n\nTap all six Download Graphic buttons and confirm that each saves the correct original file.\n\nTap the Upgrade to the Full Generator button and confirm the destination.\n\nTap the website link.", "Check for misspelled, blocked, or cut-off wording.\nPrompt 5 - Audit and repair the app\nAudit this finished $2 image-bundle delivery app before I publish it. Do not redesign it and do not change\nanything unrelated.\nTest and report:\n1. Are all six exact graphics present?\n2. Does every Download Graphic button save the correct full-quality file?\n3. Do previews work on phone and desktop?\n4. Does the Upgrade to the Full Generator button open the exact link I provided?\n5. Does the website link work?\n6. Is all wording spelled correctly and fully visible?\n7. Are there any broken buttons, missing images, paid integrations, databases, authentication, or\nunnecessary features?\nFix only confirmed problems. Preserve every working image, section, button, link, color, font, and layout.", "STEP 9: PUBLISH AND COPY THE APP LINK\n\nAfter every test passes, publish the Base44 app.\n\nOpen the public app link in a private or incognito browser window.\n\nRepeat one image download and the generator-link test.\n\nCopy the final public app link and save it in your bundle folder or business link document.\n\nThis class uses a simple public or unlisted delivery link. Adding customer accounts or a paid\nmembership gate is a different build and is not part of this $2 product.", "GLAM Daily Class | Make Money Monday\n\nPage 7", "STEP 10: CREATE THE $2 LISTING\nPaste Prompt 6 into ChatGPT and replace the fields. Check every claim against your real bundle before using\nthe copy.\nPrompt 6 - Listing and promotion\nCreate a complete $2 Tuesday listing and one promotion post for my finished image bundle app.\nBundle name: [ADD NAME]\nAudience: [ADD AUDIENCE]\nWhat the six graphics help them do: [ADD QUICK WIN]\nGraphic type and size: [ADD DETAILS]\nHow buyers receive it: A mobile-friendly download app with six individual download buttons.\nFull generator upgrade: [ADD GENERATOR NAME]\nStore or website: [ADD LINK]\nCreate:\n1. A short, clear product title.\n2. A natural sales description that does not sound like a textbook.\n3. A short What You Get section.\n4. Simple download instructions.\n5. One clear call to action.\n6. A short $2 Tuesday social post.\n7. A 20-second talking video script.\nDo not say the graphics are editable unless they truly are. Do not call it a PDF. Do not invent\ncommercial-use rights, features, formats, or guarantees. Keep the wording direct, relatable, and easy to\nunderstand.", "Your listing must clearly say:\n\u2022\n\nThe price is $2.\n\n\u2022\n\nThe buyer receives six finished graphics.\n\n\u2022\n\nThe buyer opens a mobile-friendly app to download them.\n\n\u2022\n\nThe images are not editable unless that is actually true.\n\n\u2022\n\nThe allowed use or license is stated honestly.", "STEP 11: CONNECT DELIVERY\n\nOpen the delivery or post-purchase area for your product listing.\n\nAdd this message: Thank you for your purchase. Open your image bundle app here: [PASTE APP LINK]. Tap\nany graphic, then tap Download Graphic to save it.\n\nOpen the delivery link once from the customer view if your platform provides a test or preview.\n\nDo not publish a broken or private Base44 preview link. Use the final public app link.", "STEP 12: PREPARE FOR $2 TUESDAY\n\nSave or publish the listing after the app and delivery link pass testing.\n\nSave the short social post from Prompt 6.\n\nSave the 20-second talking-video script.\n\nPrepare one clear product preview image or short screen recording of the download app.\n\nOn Tuesday, share the offer in the designated Skool $2 Tuesday thread and on your chosen social\nplatform.", "GLAM Daily Class | Make Money Monday\n\nPage 8\n\nYOUR UPSELL STRATEGY\nThe $2 bundle and the full generator should solve connected needs:\n\n$2 bundle: I need six ready-to-use graphics now.\nFull generator: I want to create more graphics in my own combinations whenever I need\nthem.\n\nUse this upsell wording inside the app:\nWant to create thousands more?\nThis bundle gives you six ready-to-use graphics. The full [GENERATOR NAME] lets you create\nyour own combinations, styles, and new images whenever you need them.\nButton: Upgrade to the Full Generator", "FINAL QUALITY CHECK\n\u2022\n\n[ ] I used an existing mini generator.\n\n\u2022\n\n[ ] My bundle has one audience and one clear purpose.\n\n\u2022\n\n[ ] I created exactly six coordinated graphics.\n\n\u2022\n\n[ ] Every graphic is saved separately at full quality.\n\n\u2022\n\n[ ] All six download buttons work.\n\n\u2022\n\n[ ] My upsell button goes to the correct full generator or related offer.\n\n\u2022\n\n[ ] The app works on phone and desktop.\n\n\u2022\n\n[ ] My product listing is priced at $2.\n\n\u2022\n\n[ ] The delivery message contains the final public app link.\n\n\u2022\n\n[ ] My Tuesday promotion is ready.\n\nYOUR ASSIGNMENT\nFinish every item on the checklist before Tuesday. On $2 Tuesday, publish or confirm the\nlisting, post the prepared promotion, and answer genuine buyer questions. Do not start\nanother product until this one is complete and available.", "WHAT YOU BUILT\nYou reused one mini generator, created a focused six-image bundle, built a better delivery experience than a\nplain PDF, added a natural path to the full generator, and prepared the offer for sale. That completes the\npath: create, finish, publish, promote, and profit responsibly.", "GLAM Daily Class | Make Money Monday\n\nPage 9"];
  var i = 0;
  var scr = document.getElementById("screen"), cnt = document.getElementById("count"),
      bar = document.getElementById("bar"), back = document.getElementById("backbtn"),
      next = document.getElementById("nextbtn"), copyb = document.getElementById("copybtn");
  function render(){
    scr.textContent = SCREENS[i];
    cnt.textContent = "Screen " + (i+1) + " of " + SCREENS.length;
    bar.style.width = ((i+1)/SCREENS.length*100) + "%";
    back.disabled = i === 0;
    next.textContent = i === SCREENS.length-1 ? "✓ Done" : "Next →";
    copyb.textContent = "Copy This Screen";
    window.scrollTo(0,0);
  }
  back.onclick = function(){ if(i>0){ i--; render(); } };
  next.onclick = function(){ if(i<SCREENS.length-1){ i++; render(); } };
  copyb.onclick = function(){
    function done(){ copyb.textContent = "Copied ✓"; }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(SCREENS[i]).then(done, function(){ fb(); }); }
    else fb();
    function fb(){ var ta=document.createElement("textarea"); ta.value=SCREENS[i]; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){} document.body.removeChild(ta); }
  };
  render();
</script>
</body>
</html>
