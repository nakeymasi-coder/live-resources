<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day-to-Night Workshop — Curriculum &amp; Prompt</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Segoe UI', system-ui, -apple-system, sans-serif; background:linear-gradient(160deg,#eaf6ff 0%,#f3fbff 55%,#e2f1fd 100%); color:#103B63; min-height:100vh; padding:18px 14px 30px; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:clamp(22px,5.4vw,30px); font-weight:900; text-align:center; line-height:1.2; background:linear-gradient(90deg,#103B63,#168FEA); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .bar { height:10px; background:#d8edfd; border-radius:99px; margin:16px 0 6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#7cc4ff,#168FEA); border-radius:99px; transition:width .25s; }
  .count { text-align:center; font-size:13px; font-weight:700; color:#2c587f; margin-bottom:12px; }
  .card { background:#fff; border:2px solid #cfe8fb; border-radius:20px; padding:20px 18px; box-shadow:0 10px 26px rgba(22,143,234,.13); min-height:300px; }
  .card pre { white-space:pre-wrap; word-wrap:break-word; font-family:inherit; font-size:16px; line-height:1.55; }
  .nav { display:flex; gap:10px; margin-top:14px; }
  .nav button { flex:1; border:none; cursor:pointer; font-weight:800; font-size:16px; padding:14px; border-radius:999px; }
  .back { background:#fff; color:#103B63; border:2px solid #a9d4f7 !important; }
  .next { background:linear-gradient(90deg,#168FEA,#103B63); color:#fff; box-shadow:0 6px 16px rgba(22,143,234,.35); }
  .copy { width:100%; margin-top:10px; border:2px solid #a9d4f7; background:#eaf6ff; color:#103B63; cursor:pointer; font-weight:800; font-size:15px; padding:12px; border-radius:999px; }
  button:disabled { opacity:.35; cursor:default; box-shadow:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Day-to-Night Workshop — Curriculum &amp; Prompt</h1>
  <div class="bar"><i id="bar"></i></div>
  <p class="count" id="count"></p>
  <div class="card"><pre id="screen"></pre></div>
  <button class="copy" id="copybtn">Copy This Screen</button>
  <div class="nav">
    <button class="back" id="backbtn">← Back</button>
    <button class="next" id="nextbtn">Next →</button>
  </div>
</div>
<script>
  var SCREENS = ["Toolbox Tuesday\nBuild a Christmas Brand World Generator\nToday\u2019s Goal\nToday, we are building a reusable Christmas creative tool\u2014not just making one random Christmas\nproduct.\nBy the end of class, you will understand how to use one complete build prompt to create a self-contained\nHTML Christmas Brand World Generator that you can save as:\nindex.html\nThen you can open it directly in your browser and keep using it after class.\n\nWhat Is Toolbox Tuesday?\nToolbox Tuesday is about learning, building, or improving something useful for your business.\nThat might be:\n\u2022 a tool\n\u2022 a workflow\n\u2022 a system\n\u2022 a generator\n\u2022 a website feature\n\u2022 a platform skill\nThe goal is to create something you can continue using\u2014not something you finish today and never touch\nagain.", "1. What We\u2019re Doing Today\nToday we are using ChatGPT to help us build a Christmas Brand World Generator.\nThe generator will help you create coordinated Christmas ideas without starting over every single time.\nYou will be able to use one Christmas concept and expand it into things like:\n\u2022 Christmas graphics\n\u2022 Christmas typography\n\u2022 male and female characters\n\n\u2022 different art styles\n\u2022 outfits\n\u2022 makeup\n\u2022 nails\n\u2022 Santa-style characters with customizable ethnicity\n\u2022 Christmas props\n\u2022 products\n\u2022 stickers\n\u2022 8-piece sticker packs\n\u2022 realistic lifestyle mockups\n\u2022 stationery\n\u2022 Holiday Duos\n\u2022 comic dialogue scenes\n\u2022 UGC storyboards\n\u2022 commercial storyboards\n\u2022 animation prompts\n\u2022 Christmas houses\n\u2022 Christmas storefronts\n\u2022 full Winter Wonderland brand worlds\nThe most important part is that everything can start from one strong Christmas concept.", "2. Why This Matters\nCreating one graphic is useful.\nCreating a tool that helps you create many coordinated graphics and products is even more useful.\nInstead of asking:\n\u201cWhat should I make next?\u201d\nyou can build one concept and keep expanding it.\nFor example:\nWinter Wonderland Concept\n\u2b07\nChristmas graphic\n\u2b07\n\nChristmas card\n\u2b07\nSticker pack\n\u2b07\nTumbler\n\u2b07\nLifestyle mockup\n\u2b07\nStorefront\n\u2b07\nCommercial storyboard\nThat means you spend less time reinventing your ideas and more time building a complete collection.\n\n3. How This Can Be Used in Business\nYou can use this type of generator for your own business or as part of services you provide.\nSome practical uses include:\n\u2610 Client holiday design work\n\u2610 Christmas product collections\n\u2610 Personalized holiday graphics\n\u2610 Christmas cards\n\u2610 Stickers and sticker packs\n\u2610 Party favors\n\u2610 Product mockups", "\u2610 Social media content\n\u2610 UGC concepts\n\u2610 Christmas marketing campaigns\n\u2610 Custom holiday design services\n\u2610 Digital resources\n\u2610 Future generator products\n\u2610 Product collection planning\n\u2610 Holiday branding inspiration\nThe generator gives you a system for developing ideas faster and keeping them connected.\nThere is no guarantee that a product or service will make money. The goal is to give you a useful creative\nbusiness tool that you can build on.\n\n4. Step 1 \u2014 Open ChatGPT\n\u2610 Open ChatGPT.\nYou can use the ChatGPT website or app.\nMake sure you are logged into the account you normally use for your projects.\n\n5. Step 2 \u2014 Start a New Chat\n\u2610 Click New Chat.\nStarting with a fresh chat helps keep the project organized.\nYou are going to use this chat specifically for building your Christmas generator.\n\n6. Step 3 \u2014 Copy the Christmas Brand World\nGenerator Build Prompt\nYou will receive a complete Christmas Brand World Generator Build Prompt.\nFor the first build:", "Use the prompt exactly as it is.\nDo not worry about changing every section yet.\nWe want to get the complete generator working first.\n\u2610 Copy the entire build prompt.\n\n7. Step 4 \u2014 Paste the Prompt Into ChatGPT\n\u2610 Paste the full build prompt into your new ChatGPT conversation.\n\u2610 Submit the prompt.\nChatGPT should begin creating the HTML, CSS, and JavaScript needed for your generator.\nThe goal is to receive one complete HTML document.\n\n8. Step 5 \u2014 Save the HTML\nOnce ChatGPT finishes creating your generator:\n\u2610 Copy the entire finished code.\nDo not copy only part of it.\nThe file should contain the HTML, CSS, and JavaScript together.\nCreate a new file and save it as:\nindex.html\n\nImportant\nMake sure the ending is:\n.html\nNot:\nindex.txt\nNot:\nindex.html.txt\nCorrect:\n\u2705 index.html", "9. Step 6 \u2014 Open the Generator\nFind the index.html file you saved.\n\u2610 Double-click it.\nIt should open in your normal internet browser.\nYou do not need a complicated website setup just to test this version.\nThe generator can run directly from the HTML file.\n\n10. Step 7 \u2014 Explore the Main Sections\nYour generator should have organized areas similar to:", "Create\nBuild the main Christmas idea.\n\nStyle\nChoose the visual look, colors, art direction, and mood.\n\nCharacter\nCreate and customize your Christmas characters.\n\nProducts\nTurn the concept into products and printable designs.\n\nMockups\nCreate prompts showing your products in realistic settings.", "Holiday Duos\nCreate two-character scenes and interactions.\n\nStoryboards\nPlan UGC, commercials, reels, cartoons, and product promotions.\n\nChristmas World\nExpand your concept into complete Christmas environments.\n\nPresets\nUse ready-made starting combinations.\n\nOutput\nView and copy the finished generated prompt.\nYou do not need to test every option today.\nFocus on understanding how the sections work together.\n\n11. Step 8 \u2014 Create One Christmas Concept\nEveryone will begin with the same practice concept.", "Classic Christmas Winter Wonderland\nUse:\n\n\u2610 Classic red\n\u2610 Evergreen\n\u2610 Gold\n\u2610 Snowy white\n\u2610 Warm white lights\n\u2610 Santa-style character\n\u2610 Red-nosed reindeer\n\u2610 Snowy village\n\u2610 Christmas trees\n\u2610 Wrapped gifts\n\u2610 Candy canes\n\u2610 Sleigh\n\u2610 Toy-shop details\n\u2610 Magical cozy Christmas mood\nThe goal is to create one clear visual direction that we can reuse throughout the generator.\n\n12. Step 9 \u2014 Generate the Main Prompt\nOnce your selections are ready:\n\u2610 Click Generate Prompt.\nRead the prompt your generator creates.\nYou do not have to rewrite it from scratch.\nThis generated prompt becomes the foundation for your Christmas concept.\n\n13. Step 10 \u2014 Create the Main Image\n\u2610 Copy your generated prompt.\n\u2610 Open ChatGPT image generation.\n\u2610 Paste the prompt.\n\u2610 Generate your main Christmas image.\nThis image will help establish the look of your Christmas collection.\nPay attention to:\n\u2022 colors\n\u2022 mood\n\u2022 characters\n\u2022 props\n\u2022 lighting\n\u2022 art style\n\u2022 Christmas details\nYou want these elements to feel like they belong together.", "14. Step 11 \u2014 Expand the Same Concept\nNow reuse the same Christmas concept instead of creating something completely unrelated.\nChoose at least one:\n\u2610 Christmas card\n\u2610 Individual sticker\n\u2610 8-piece sticker pack\n\u2610 Tumbler\n\u2610 Stationery piece\n\u2610 Party favor\n\u2610 Lifestyle mockup\n\nThe goal is visual consistency.\nIf your main concept uses:\n\u2022 classic red\n\u2022 evergreen\n\u2022 gold\n\u2022 snowy white\n\u2022 cozy lighting\nyour other products should still feel connected to that same Christmas world.\n\n15. Step 12 \u2014 Create a Real-Life Mockup\nA lifestyle mockup should show the product being used naturally.\nDo not always show the product floating by itself on a blank background.", "Example\nInstead of only showing a Christmas tumbler:\nCreate a scene showing:\nA woman naturally drinking from the Christmas tumbler inside a decorated holiday kitchen.\nThe setting might include:\n\u2022 Christmas lights\n\u2022 greenery\n\u2022 holiday d\u00e9cor\n\u2022 realistic furniture\n\u2022 natural hand placement\n\u2022 believable lighting\nThe product should still remain easy to see.\nLifestyle mockups help customers imagine the product in real life.\n\n16. Step 13 \u2014 Create a Holiday Duo\nA Holiday Duo uses two characters together.\n\nThey can:\n\u2022 interact\n\u2022 joke\n\u2022 argue\n\u2022 celebrate\n\u2022 exchange gifts\n\u2022 work together\n\u2022 appear in matching scenes\n\nExample\nA snowman and red-nosed reindeer in a funny bickering scene with speech bubbles.\nKeep the characters visually connected to your main Christmas concept.\n\n17. Step 14 \u2014 Create a Storyboard\nChoose one storyboard type:\n\u2610 UGC\n\u2610 Commercial\n\u2610 Social reel\n\u2610 Cartoon\n\u2610 Product promo\nA storyboard breaks your idea into individual scenes.", "Example\nScene 1: Product introduction\nScene 2: Person using the product\nScene 3: Close-up detail\nScene 4: Christmas environment\nScene 5: Final product moment\n\nImportant\nEach storyboard scene should stay separate.\nDo not turn the entire storyboard into one big collage unless you specifically want a storyboard sheet.\nThe individual scenes can later become images, videos, reels, or animation prompts.\n\n18. Step 15 \u2014 Build the Christmas World\nNow take the same Christmas concept and make the environment bigger.\nYour Winter Wonderland could expand into:\n\u2610 Storefront\n\u2610 Boutique interior\n\u2610 Toy shop\n\u2610 Bakery\n\u2610 Christmas village\n\u2610 House exterior\n\u2610 Decorated room\n\u2610 Winter street\nFor example, your original concept might start with:\nClassic Christmas Winter Wonderland\nThen become:\nClassic Christmas Winter Wonderland Toy Shop\nThen:\nClassic Christmas Winter Wonderland Main Street\nThen:\n\nClassic Christmas Winter Wonderland Village\nNow you are no longer creating disconnected pictures.\nYou are creating a full visual brand world.", "19. Business Challenge\nBefore you finish today, complete this simple challenge.\n\nRequired\n\u2610 One Christmas generator\n\u2610 One Christmas concept\n\u2610 One main image\n\u2610 One product variation\n\u2610 One lifestyle mockup\n\u2610 One Christmas World scene\n\nBonus\n\u2610 Holiday Duo\n\u2610 Storyboard\n\u2610 8-piece sticker pack\nYou do not have to build everything inside the generator today.\nThe goal is to understand the system and leave class with something you can continue using.\n\n20. Key Lesson\nDo not create everything from scratch.\nCreate one strong concept.\n\nThen reuse it across:\nProducts \u2192 Content \u2192 Mockups \u2192 Marketing \u2192 Characters \u2192 Storyboards \u2192 Environments\nThat is how one Christmas idea can grow into an entire coordinated creative collection.", "Remember:\n\u2610 Start with one clear idea.\n\u2610 Keep your colors consistent.\n\u2610 Keep your characters connected.\n\u2610 Keep your visual style consistent.\n\u2610 Reuse what already works.\n\u2610 Expand instead of constantly restarting.\nYour goal is not to create the most Christmas graphics.\nYour goal is to build a tool and a system that makes creating them easier.", "Toolbox Tuesday\nBuild the tool once. Keep using it. Keep expanding it."];
  var i = 0;
  var scr = document.getElementById("screen"), cnt = document.getElementById("count"),
      bar = document.getElementById("bar"), back = document.getElementById("backbtn"),
      next = document.getElementById("nextbtn"), copyb = document.getElementById("copybtn");
  function render(){
    scr.textContent = SCREENS[i];
    cnt.textContent = "Screen " + (i+1) + " of " + SCREENS.length;
    bar.style.width = ((i+1)/SCREENS.length*100) + "%";
    back.disabled = i === 0;
    next.textContent = i === SCREENS.length-1 ? "✓ Done" : "Next →";
    copyb.textContent = "Copy This Screen";
    window.scrollTo(0,0);
  }
  back.onclick = function(){ if(i>0){ i--; render(); } };
  next.onclick = function(){ if(i<SCREENS.length-1){ i++; render(); } };
  copyb.onclick = function(){
    function done(){ copyb.textContent = "Copied ✓"; }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(SCREENS[i]).then(done, function(){ fb(); }); }
    else fb();
    function fb(){ var ta=document.createElement("textarea"); ta.value=SCREENS[i]; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){} document.body.removeChild(ta); }
  };
  render();
</script>
</body>
</html>
