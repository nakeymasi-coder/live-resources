<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Forms — Student Guide</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Segoe UI', system-ui, -apple-system, sans-serif; background:linear-gradient(160deg,#eaf6ff 0%,#f3fbff 55%,#e2f1fd 100%); color:#103B63; min-height:100vh; padding:18px 14px 30px; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:clamp(22px,5.4vw,30px); font-weight:900; text-align:center; line-height:1.2; background:linear-gradient(90deg,#103B63,#168FEA); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .bar { height:10px; background:#d8edfd; border-radius:99px; margin:16px 0 6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#7cc4ff,#168FEA); border-radius:99px; transition:width .25s; }
  .count { text-align:center; font-size:13px; font-weight:700; color:#2c587f; margin-bottom:12px; }
  .card { background:#fff; border:2px solid #cfe8fb; border-radius:20px; padding:20px 18px; box-shadow:0 10px 26px rgba(22,143,234,.13); min-height:300px; }
  .card pre { white-space:pre-wrap; word-wrap:break-word; font-family:inherit; font-size:16px; line-height:1.55; }
  .nav { display:flex; gap:10px; margin-top:14px; }
  .nav button { flex:1; border:none; cursor:pointer; font-weight:800; font-size:16px; padding:14px; border-radius:999px; }
  .back { background:#fff; color:#103B63; border:2px solid #a9d4f7 !important; }
  .next { background:linear-gradient(90deg,#168FEA,#103B63); color:#fff; box-shadow:0 6px 16px rgba(22,143,234,.35); }
  .copy { width:100%; margin-top:10px; border:2px solid #a9d4f7; background:#eaf6ff; color:#103B63; cursor:pointer; font-weight:800; font-size:15px; padding:12px; border-radius:999px; }
  button:disabled { opacity:.35; cursor:default; box-shadow:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Interactive Forms — Student Guide</h1>
  <div class="bar"><i id="bar"></i></div>
  <p class="count" id="count"></p>
  <div class="card"><pre id="screen"></pre></div>
  <button class="copy" id="copybtn">Copy This Screen</button>
  <div class="nav">
    <button class="back" id="backbtn">← Back</button>
    <button class="next" id="nextbtn">Next →</button>
  </div>
</div>
<script>
  var SCREENS = ["Build Interactive Forms\nToday you will build your form system, customize one business form, and check that the\nanswers arrive. Follow Glam during the live for the connection steps.\n\nBefore we start\nOpen your AI app builder and bring your business name, an app name, and two brand colors.\nChoose one form: order request, client intake, event registration, product quiz, or feedback.", "Follow these six steps\n1. Choose your purpose. Example: \u201cI need customers to send their flyer or invitation\ndetails so I can give them a quote.\u201d\n2. Paste the prompt. On the following pages, replace only the first three brand lines. Copy\nthe entire prompt into your app builder and submit it once.\n3. Customize one form. In your generated app, choose Create a Form and a template. Add\nyour title, questions, colors, and welcome message.\n4. Make a choice change the questions. Example: Flyer shows promotion details.\nInvitation shows event date, location, and RSVP details. Preview both choices.\n5. Connect and test with Glam. Follow the live connection steps. Open your published\nform in a separate private browser window and submit sample details. Return to your\naccount and open Responses.\n6. Share your progress. Post your form type and \u201cTest response received\u201d in the\ncommunity only after you can see the saved answers. If stuck, post the step and what\nhappened; hide private details.", "Your finish check\nThe form works on your phone. Both question paths work. A test response appears in your\nprivate inbox. Confetti appears only after saving succeeds.\nIf you are selling access: test two Starter forms, the third-form upgrade message, and\npurchase-to-access delivery before publishing your offer. Keep the listing in draft until those\nwork.", "Your Complete Build Prompt\nReplace the three brand lines. Copy from BUSINESS NAME through the final sentence. The\nfull prompt is included so everyone builds the same system.\nBUSINESS NAME: [your business name]\nAPP NAME: [your app name, or use Form Studio]\nBRAND COLORS: [two colors, or sapphire blue and deep navy]\nBuild the complete hosted interactive form-builder app below in one build. Include its real\nbackend, protected accounts, persistent media storage, working templates, public forms, and\nprivate response inbox. Do not deliver only a mockup or a list of instructions.\nUse your platform\u2019s supported services. If an essential service is unavailable, finish the\nindependent work and name the exact blocker. Never label an unconnected feature as working.\nDo not expose secrets or pretend a hidden frontend button is secure administration.", "BUSINESS MODEL\nStarter: $2 one-time purchase, two form project slots, full visual quality, editable questions and\nbranding, publication, response inbox, and CSV export. Draft and published projects each use a\nslot. Editing/republishing does not. Duplicating/importing a new project uses another slot.\nArchiving retains its slot; permanent deletion frees it after explicit confirmation about losing the\nlink and responses.\nFull System: owner-configurable larger form allowance and price. Leave its price and allowance\nunconfigured initially; never invent unlimited access. Existing work survives upgrading.\nEnforce quotas on the backend, including concurrent requests and all creation routes. Users can\ndismiss upgrade offers and keep using existing forms.", "AUTHENTICATION AND ACCESS\nUse real customer accounts and server-side ownership checks. Keep owner administration\nseparate from customer settings. Grant paid access only from a verified server-side purchase\nevent or explicit protected owner grant. Do not unlock from URL parameters, local storage,\nbrowser redirects, or clicked payment buttons. Provide a clear admin setup screen for checkout\ncredentials and product IDs. Until connected, hide purchase buttons and allow clearly labeled test\naccess. Make actual storage/submission limits configurable and disclose enforced limits\naccurately.", "APP DESIGN\nMobile-first, separate pages/routes, uncluttered Home, compact header, hamburger menu, and\nbottom navigation: Home, My Forms, Create, Settings. Provide separate pages for Responses,\nProfile, Help, and Upgrade. Home shows only a short hero, greeting, Create a Form, Continue\nEditing when available, and usage count. No long stacked homepage.\nUse sapphire/deep navy, silver, white, readable type, dimensional cards, refined highlights,\ngentle transitions, and restrained selection glow. Respect reduced motion. No crowns, hearts,\nflowers, robots, random icons, fake dashboards, or decorative filler. Clear labels, keyboard focus,\ncontrast, and large touch targets are required.\nProvide app-like phone behavior. Offer PWA installation only if actually implemented and\nsupported. Do not claim App Store availability or untested offline access.\n\nWELCOME AND PROFILE\nFirst-use tutorial modal: Choose a Form; Customize Questions and Design; Preview and Test;\nPublish and View Responses. Next, Back, Skip, completion memory, and Replay in Help must\nwork. Manage modal focus and Escape behavior.\nCustomer Profile: display name, business name, upload/replace/remove profile picture.\nCustomer Settings: theme, text size, reduced motion, tutorial preference, current plan and usage.", "TEMPLATES\nInclude five complete, usable templates plus Start from Scratch:\n1. Custom Order / Quote Request: picture/product choices, quantities, conditional customization\ndetails, needed-by date, optional reference upload, contact details, configured estimate, review,\nrequest confirmation.\n2. Client Intake: service, goals, project details, timeline, optional budget/reference uploads,\ncontact details, project summary.\n3. Workshop / Event Registration: session, attendee details, conditional attendance questions,\nreview, accurate next steps.\n4. Product-Match Quiz: visual choices, configured scoring, tie handling, matching result and\noptional product link; contact collection optional and labeled.\n5. Feedback / Testimonial: ratings, conditional follow-up, feedback, optional contact details,\nseparate permission to publish the testimonial.", "GUIDED CREATION\nAsk what the form is for, who fills it out, what information is needed, and what should happen\nafterward. Provide concrete example answers.\nProvide template and manual creation. If a genuine server-side AI integration is available, offer\nDescribe My Form to suggest structured questions for review. Do not execute AI-generated\nJavaScript or pretend fixed templates are AI. Do not send customer submissions to AI by default.\nKeep manual/template workflows fully functional without AI.\n\nFORM EDITOR\nSeparate Questions, Design, Logic, Completion, Preview, and Publish sections.\nSupport short/long text, email, phone, number, date, dropdown, single/multiple choice, image\nchoices, ratings, file upload, and informational sections.\nAdd/edit/duplicate/reorder/remove fields. Required/optional, helper text, sample placeholders,\nvalidation, sections, Back/Next, one-question or short-section layout, and review-before-submit.\nConditional rules use plain language: If answer is X, show Y. Prevent circular/broken rules. Hidden\nfields must not block submission or contribute irrelevant stored answers.\nCalculations use configured base prices, quantities, add-ons, and currency only. Validate\nserver-side; never execute arbitrary formulas. Label estimated prices as estimates.", "DESIGN AND MEDIA\nPer-form controls: business name, logo, title, description, colors, fonts, background, card\nappearance, buttons, header image/video, progress style, transitions, and completion effects.\nProvide several polished presets.\nUse real media uploads with validation, progress, error handling, replacement, and removal.\nSupport picture choices, logo, hero image/video, and poster image. Muted video by default;\ncontrols, mobile inline playback, optional loop/autoplay, reduced-motion support, poster fallback.\nUse a designed placeholder until real media is supplied; no invented media URLs.\n\nPUBLISHED EXPERIENCE\nWelcome screen \u2192 relevant questions \u2192 review \u2192 submit \u2192 confirmation.\nSelections visibly respond. Show progress and field-level errors. Preserve answers on failed\nsubmission. Prevent duplicate submissions from clicks/retries.\nConfetti is optional and appears ONLY after successful backend saving. A quiz result must come\nfrom real scoring, not random output.\nAn order request is not a paid order. A registration request is not a confirmed paid place. A date\nrequest is not a calendar booking. Completion copy must reflect the actual action.", "RESPONSES AND PUBLISHING\nStore submissions under the correct form and owner. Private inbox, detail view, timestamps,\nform/version information, search, CSV export with spreadsheet-formula safety, private file access,\nand confirmed deletion.\nEmail notifications require real setup; the inbox must work without email. Never claim an email\nwas delivered without evidence.\nStable public link, Copy Link, Open Published Form, supported embed code, publish/unpublish.\nDraft edits do not alter the live form until published. Preserve historical response meaning when\nfields change. Keep preview/test responses distinct from live responses.\nEnforce private data access server-side. Validate submissions, limit spam, restrict uploads, keep\nfiles private, and allow creator-provided privacy/consent text. Do not invent compliance claims.\n\nCLIENT USE\nAllow business/client project names and branding per form. Customers may create forms for\nthemselves or deliver customized forms to clients. Public sharing does not transfer ownership or\nresponse access. Explain which account owns and hosts the form. Do not grant resale of the\nbuilder itself.", "PRIVATE PLATFORM ADMIN\nOwner-only, server-authorized controls:\n- App name, tagline, logo, colors, fonts, text size, buttons, card depth, background, motion.\n- Header image/video/poster upload, crop, focal point, overlay, mobile/desktop height, playback\nsettings.\n- Home/menu/tutorial/help wording and starter templates.\n- Starter/Full prices and allowances, real service limits, checkout configuration, upgrade\ncopy/media/link.\n- Auditable customer access grants and revocations.\n- Save Draft, mobile/desktop preview, Publish Changes, cancel, restore default style with\nconfirmation.\nPersist configurations in the backend. Never expose private credentials in public settings.\n\nUPGRADE\nWhen exceeding allowance: \u201cYou\u2019ve used your two included form slots. Create more forms for\nyour business or clients with the Full System.\u201d Dismissible; existing work remains usable. Offer\nupgrade in account details and menu without interrupting normal tasks repeatedly. Hide\ncheckout until genuinely configured.", "SEED A CLEARLY LABELED DEMO TEMPLATE\nCustom Design Request. Fields: name, email, Flyer or Invitation, needed-by date, exact wording,\ncolors, optional reference image. Flyer branch: promotion title, offer details, contact/CTA.\nInvitation branch: occasion, event date/time, location, RSVP details. Review before sending.\nConfirmation: \u201cYour design request has been received. We\u2019ll review the details and contact you\nabout availability and a quote. Your order is not confirmed yet.\u201d Do not pretend demo\nsubmissions are live customer activity.\n\nAUDIT\nTest all five templates, field editing, branching, calculations, scoring, upload errors, genuine\nsaving, no false success on failure, private inbox access, CSV, draft/live versions, Starter limits on\nall creation paths, upgrades, tutorial, profile, settings, admin security, media settings, mobile\nnavigation, and reduced motion. Report actual checks and blockers honestly.\nAfter the complete build, guide me through testing one task at a time. Do not make me manually\nbuild the system one card at a time. Do not automatically publish a sales offer before access and\nsubmission tests pass."];
  var i = 0;
  var scr = document.getElementById("screen"), cnt = document.getElementById("count"),
      bar = document.getElementById("bar"), back = document.getElementById("backbtn"),
      next = document.getElementById("nextbtn"), copyb = document.getElementById("copybtn");
  function render(){
    scr.textContent = SCREENS[i];
    cnt.textContent = "Screen " + (i+1) + " of " + SCREENS.length;
    bar.style.width = ((i+1)/SCREENS.length*100) + "%";
    back.disabled = i === 0;
    next.textContent = i === SCREENS.length-1 ? "✓ Done" : "Next →";
    copyb.textContent = "Copy This Screen";
    window.scrollTo(0,0);
  }
  back.onclick = function(){ if(i>0){ i--; render(); } };
  next.onclick = function(){ if(i<SCREENS.length-1){ i++; render(); } };
  copyb.onclick = function(){
    function done(){ copyb.textContent = "Copied ✓"; }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(SCREENS[i]).then(done, function(){ fb(); }); }
    else fb();
    function fb(){ var ta=document.createElement("textarea"); ta.value=SCREENS[i]; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){} document.body.removeChild(ta); }
  };
  render();
</script>
</body>
</html>
